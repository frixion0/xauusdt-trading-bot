services:
  - type: web
    name: xauusdt-trading-bot
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        generateValue: true
      - key: MUDREX_API_KEY
        sync: false
      - key: LEVERAGE
        value: "100"
      - key: QUANTITY
        value: "0.002"
      - key: STOP_LOSS_PCT
        value: "0.5"
      - key: TAKE_PROFIT_PCT
        value: "1.0"
